# RustSec policy exceptions.
#
# Every entry below is explicit and reviewable. Advisories with an available
# compatible fix must not be added here. In particular, RUSTSEC-2026-0119 is
# intentionally absent and remains a blocking vulnerability until the DNS
# dependency is upgraded to hickory-proto >= 0.26.1.

[advisories]
ignore = [
    # hickory-proto NSEC3 validation issue: upstream currently publishes no
    # fixed release. Kanari does not perform authoritative DNSSEC validation,
    # but the transitive dependency remains tracked for replacement/upgrade.
    "RUSTSEC-2026-0118",

    # RustCrypto rsa Marvin attack: no fixed rsa release exists. Kanari's
    # production use is public-key RS256 verification only; it performs no RSA
    # private-key decryption/signing operation. Test-only key generation remains
    # isolated from production secrets.
    "RUSTSEC-2023-0071",

    # Unmaintained transitive/direct crates. These are accepted temporarily so
    # `cargo audit --deny warnings` remains useful for new advisories. Removal
    # requires protocol/serialization or PQC compatibility migrations.
    "RUSTSEC-2025-0141", # bincode 1.x and 2.x
    "RUSTSEC-2020-0095", # difference
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2024-0380", # pqcrypto-dilithium -> pqcrypto-mldsa migration
    "RUSTSEC-2026-0163", # pqcrypto-internals / archived PQClean upstream
    "RUSTSEC-2026-0160", # pqcrypto-sphincsplus / archived PQClean upstream
    "RUSTSEC-2026-0162", # pqcrypto-traits / archived PQClean upstream
]
