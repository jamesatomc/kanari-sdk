[package]
name = "kanari-types"
edition.workspace = true
categories.workspace = true
keywords.workspace = true
homepage.workspace = true
documentation.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[features]
# Gas implementation is selected once in kanari-types. gas-v1 explicitly
# overrides the default gas-v2 selection when both features are unified.
default = ["gas-v2"]
gas-v1 = []
gas-v2 = []
# Backward-compatible alias for existing build commands.
zero-gas = ["gas-v2"]

[dependencies]
move-core-types = { workspace = true}
# Error handling
anyhow = { workspace = true }

lazy_static = { workspace = true }
serde = { workspace = true }
hex = { workspace = true }
sha3 = { workspace = true }
kanari-crypto = { workspace = true }
tracing = { workspace = true }
bcs = { workspace = true }
smt = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
