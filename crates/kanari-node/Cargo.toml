[package]
name = "kanari-node"
edition.workspace = true
categories.workspace = true
keywords.workspace = true
homepage.workspace = true
documentation.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
anyhow = { workspace = true }
kanari-core = { workspace = true }
kanari-rpc-server = { workspace = true }
kanari-types = { workspace = true }
kanari-crypto = { workspace = true }
kanari-indexer = { path = "../kanari-indexer" }
move-core-types = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true, features = ["derive"] }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
# libp2p 0.57 upgrades libp2p-mdns to 0.49 and hickory-proto to 0.26.1,
# fixing RUSTSEC-2026-0119 in the mDNS message encoder.
libp2p = { version = "0.57.0", features = ["tcp", "noise", "yamux", "gossipsub", "mdns", "kad", "identify", "macros", "tokio", "relay", "dcutr", "ping"] }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
tempfile = { workspace = true }
flate2 = { workspace = true }

[features]
default = []
zero-gas = ["kanari-types/zero-gas", "kanari-core/zero-gas"]
