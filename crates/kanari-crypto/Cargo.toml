[package]
name = "kanari-crypto"
edition.workspace = true
categories.workspace = true
keywords.workspace = true
homepage.workspace = true
documentation.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
bip39.workspace = true
# Core crypto libraries
k256 = { workspace = true, features = ["ecdsa", "std"] }
p256 = { workspace = true, features = ["ecdsa", "std"] }
ed25519-dalek = { workspace = true, features = ["rand_core", "batch"] }
secp256k1 = { workspace = true, features = ["recovery", "rand", "global-context"] }
rsa = { workspace = true, features = ["hazmat", "sha2"] }
sha2.workspace = true
sha3.workspace = true
shake.workspace = true
zstd.workspace = true
hmac.workspace = true
rayon.workspace = true

# Post-Quantum Cryptography (PQC) - NIST Standards
ml-dsa = { workspace = true, optional = true } # Pure Rust FIPS 204 ML-DSA provider
slh-dsa = { workspace = true, optional = true } # Pure Rust FIPS 205 SLH-DSA provider
falcon = { workspace = true, optional = true } # Pure Rust FIPS 206 FN-DSA/Falcon provider

# Make blake3 optional and enabled via the blake3 feature
blake3 = { workspace = true, optional = true }

# BIP32/BIP44 HD wallet support
bip32.workspace = true

rand.workspace = true
hex.workspace = true
serde_json = { workspace = true, default-features = true }
lazy_static.workspace = true
toml.workspace = true
log.workspace = true
serde.workspace = true
thiserror.workspace = true
argon2.workspace = true
base64.workspace = true
aes-gcm.workspace = true

# Memory security
zeroize.workspace = true
fs2.workspace = true

# Constant-time operations for timing attack prevention
subtle.workspace = true

# Time handling for audit logging
chrono = { workspace = true }

# Add common dependency
kanari-common.workspace = true
move-core-types = { workspace = true }

[dev-dependencies]
proptest.workspace = true
tempfile = { workspace = true }

[[bench]]
name = "signature_schemes"
harness = false

[features]
# keep blake3 optional in Cargo.toml but enable it in the crate default features
default = ["blake3", "pqc"]
# Enable maintained PQC providers when `pqc` feature is activated
pqc = ["ml-dsa", "falcon", "slh-dsa"]
experimental-slh-dsa = ["slh-dsa"]
experimental-falcon = ["falcon"]
hybrid = ["pqc"] # Hybrid classical + PQC schemes
