# Cargo cross-compilation configuration for Android targets

[build]
# Target directory for build outputs
target-dir = "target"

# Android ARM64 (arm64-v8a) - Most common on modern phones
[target.aarch64-linux-android]
linker = "aarch64-linux-android-clang"
ar = "aarch64-linux-android-ar"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# Android ARM32 (armeabi-v7a) - Support for older devices
[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi-clang"
ar = "arm-linux-androideabi-ar"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# Android x86_64 (for emulator and Intel devices)
[target.x86_64-linux-android]
linker = "x86_64-linux-android-clang"
ar = "x86_64-linux-android-ar"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# Android x86 (for older emulators)
[target.i686-linux-android]
linker = "i686-linux-android-clang"
ar = "i686-linux-android-ar"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
