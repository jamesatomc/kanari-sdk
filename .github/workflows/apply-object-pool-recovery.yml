name: Apply Object Pool Recovery

on:
  push:
    branches:
      - object-centric

permissions:
  contents: write

concurrency:
  group: apply-object-pool-recovery
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[object-pool-recovery]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: object-centric
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Apply object pool recovery
        run: python .github/scripts/apply_object_pool_recovery.py

      - name: Format
        run: cargo fmt --all

      - name: Build framework
        run: cargo build -p kanari-framework-builder

      - name: Check affected crates
        run: |
          cargo check \
            -p kanari-move-runtime-v1 \
            -p kanari-core \
            -p kanari-rpc-server \
            -p kanari-rpc-client \
            -p kanari-node \
            -p kanari

      - name: Test object path
        run: |
          cargo test -p kanari-core --lib object_ -- --nocapture
          cargo test -p kanari-rpc-server --lib
          cargo test -p kanari-node --lib

      - name: Commit validated recovery
        run: |
          git config user.name 'kanari-object-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No object recovery changes required'
            exit 0
          fi
          git commit -m 'fix: recover stale object pool and execute gossip [object-pool-recovery]'
          git push origin HEAD:object-centric
