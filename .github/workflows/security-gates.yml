name: Kanari Security Gates

on:
  pull_request:
  push:
    branches:
      - "kanari-sdk"
  workflow_dispatch:
    inputs:
      run_chaos:
        description: "Run disposable four-node RPC chaos exercise"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_fuzz_campaign:
        description: "Run bounded fuzz/conflict campaign"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_crypto_fuzz_campaign:
        description: "Run longer kanari-crypto fuzz/dependency campaign"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "17 20 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deterministic-security-tests:
    name: Deterministic security tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-security-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: RPC load generator unit gates
        run: cargo test -p kanari-rpc-loadgen

      - name: P2P decompression / DoS one-shot gate
        run: cargo test -p kanari-node long_run_malformed_compressed_payloads_are_bounded -- --ignored --test-threads=1

      - name: Byzantine Mysticeti native block one-shot gate
        run: cargo test -p kanari-core long_run_byzantine_native_blocks_cannot_advance_checkpoint -- --ignored --test-threads=1

      - name: Kanari crypto deterministic compatibility gate
        run: cargo test -p kanari-crypto --all-features --test compatibility_test -- --test-threads=1

  four-node-chaos:
    name: Four-node RPC chaos
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_chaos == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-chaos-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build chaos binaries
        shell: pwsh
        run: |
          cargo build -p kanari-node --release
          cargo build -p kanari-rpc-loadgen --release

      - name: Run four-node chaos gate
        shell: pwsh
        run: |
          .\scripts\run-local-four-node-chaos.ps1 `
            -Requests 500 `
            -Concurrency 32 `
            -TimeoutSec 5 `
            -MinRps 1 `
            -MaxP99Ms 5000 `
            -MaxEndpointImbalancePercent 10 `
            -SkipBuild

  fuzz-campaign:
    name: Fuzz / conflict campaign
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_fuzz_campaign == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-fuzz-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run bounded fuzz/conflict campaign
        shell: pwsh
        run: |
          .\scripts\run-fuzz-campaign.ps1 `
            -Hours 1 `
            -Workers 1 `
            -IncludeIgnoredLongRuns

  crypto-fuzz-campaign:
    name: Kanari crypto fuzz / dependency campaign
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_crypto_fuzz_campaign == 'true')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/advisory-db
            target
          key: ${{ runner.os }}-crypto-fuzz-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run kanari-crypto long fuzz/dependency campaign
        shell: pwsh
        run: |
          .\scripts\run-crypto-fuzz-campaign.ps1 `
            -Hours 4 `
            -Cases 8192 `
            -Workers 1
