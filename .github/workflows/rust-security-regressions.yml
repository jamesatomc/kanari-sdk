name: Rust integration validation

on:
  pull_request:
    branches: [kanari-sdk]
  push:
    branches:
      - "security/**"
      - "ci/**"

permissions:
  contents: write

concurrency:
  group: rust-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/full-remediation-20260620
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Merge remediation branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name kanari-ci
          git config user.email ci@users.noreply.github.com
          for branch in \
            security/fix-critical-object-view-20260620 \
            security/consensus-hash-binding-20260620 \
            security/disable-unsafe-views-20260620 \
            security/node-startup-hardening-20260620 \
            fix/session-lifetime-20260620 \
            fix/mempool-admission-20260620
          do
            git fetch origin "$branch"
            git merge --no-edit --no-ff "origin/$branch"
          done
      - name: Validate affected crates
        run: |
          cargo fmt --all
          git diff --check
          cargo check -p kanari-auth -p kanari-node -p kanari-core -p kanari-rpc-server -p kanari-move-runtime-v1
          cargo test -p kanari-auth --lib
      - name: Push consolidated branch
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: format consolidated changes"
          fi
          git push origin HEAD:security/full-remediation-20260620
