name: Release Builds

on:
  release:
    types: [created]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
          
          # macOS
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross for cross-compilation
      if: matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'aarch64-pc-windows-msvc'
      run: |
        cargo install cross --git https://github.com/cross-rs/cross

    - name: Build Move frameworks (native)
      if: matrix.target != 'aarch64-unknown-linux-gnu' && matrix.target != 'aarch64-pc-windows-msvc'
      run: cargo build --package kanari-framework-builder --release

    - name: Build Move frameworks (cross)
      if: matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'aarch64-pc-windows-msvc'
      run: cargo build --package kanari-framework-builder --release

    - name: Build release (native)
      if: matrix.target != 'aarch64-unknown-linux-gnu' && matrix.target != 'aarch64-pc-windows-msvc'
      run: cargo build --release --target ${{ matrix.target }}

    - name: Build release (cross)
      if: matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'aarch64-pc-windows-msvc'
      run: cross build --release --target ${{ matrix.target }}

    - name: Package with Move frameworks (Unix)
      if: matrix.archive == 'tar.gz'
      shell: bash
      run: |
        mkdir -p package
        cp target/${{ matrix.target }}/release/kanari-node package/ 2>/dev/null || true
        cp target/${{ matrix.target }}/release/kanari package/ 2>/dev/null || true
        cp target/${{ matrix.target }}/release/kanari-faucet package/ 2>/dev/null || true
        cp -r crates/kanari-frameworks/packages package/crates/kanari-frameworks/ 2>/dev/null || true
        cd package
        tar czf ../kanari-${{ matrix.target }}.tar.gz *

    - name: Package with Move frameworks (Windows)
      if: matrix.archive == 'zip'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path package -Force
        Copy-Item target/${{ matrix.target }}/release/kanari-node.exe package/ -ErrorAction SilentlyContinue
        Copy-Item target/${{ matrix.target }}/release/kanari.exe package/ -ErrorAction SilentlyContinue
        Copy-Item target/${{ matrix.target }}/release/kanari-faucet.exe package/ -ErrorAction SilentlyContinue
        Copy-Item -Recurse crates/kanari-frameworks/packages package/crates/kanari-frameworks/ -ErrorAction SilentlyContinue
        Compress-Archive -Path package/* -DestinationPath kanari-${{ matrix.target }}.zip

    - name: Upload release assets
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: kanari-${{ matrix.target }}.${{ matrix.archive }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kanari-${{ matrix.target }}
        path: kanari-${{ matrix.target }}.${{ matrix.archive }}
