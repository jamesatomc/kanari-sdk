name: Security test migration latest

on:
  pull_request:
    branches:
      - fix-gas
    paths:
      - .github/workflows/security-test-migration-latest.yml
      - scripts/migrate_security_tests.py
      - crates/kanari-frameworks/**
      - crates/kanari-framework-builder/**
      - move-execution/v1/kanari-move-runtime-v1/src/storage/persistent_store.rs

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          python3 scripts/migrate_security_tests.py
          cargo fmt --all
          git diff --check
      - name: Build Move frameworks
        run: cargo build -p kanari-framework-builder
      - name: Run core tests
        id: core
        continue-on-error: true
        env:
          RUST_BACKTRACE: '0'
          CARGO_TERM_COLOR: never
        run: cargo test -p kanari-core --lib > /tmp/core-tests.log 2>&1
      - name: Publish core diagnostics
        if: steps.core.outcome == 'failure'
        run: |
          grep -n -B 6 -A 22 -E ' FAILED$|failures:|panicked at|assertion failed|called `Result::unwrap\(\)`|error\[' /tmp/core-tests.log | tail -n 1200 > CORE_TEST_ERRORS.txt || true
          if [ ! -s CORE_TEST_ERRORS.txt ]; then tail -n 500 /tmp/core-tests.log > CORE_TEST_ERRORS.txt; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CORE_TEST_ERRORS.txt
          git commit -m "chore(security): publish core test diagnostics"
          git push --force origin HEAD:security/core-test-errors
          exit 1
      - name: Commit validated test migration
        if: steps.core.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/kanari-core/tests/unit/engine_tests.rs
          git commit -m "test(security): align engine tests with canonical protocol"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
