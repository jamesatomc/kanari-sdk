name: Apply Object Checkpoint Journal V2

on:
  push:
    branches:
      - object-centric

permissions:
  contents: write

concurrency:
  group: apply-object-checkpoint-journal-v2
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[object-journal-v2]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: object-centric
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Apply object checkpoint migration
        run: |
          python .github/scripts/apply_object_checkpoint_journal.py
          python .github/scripts/fix_object_checkpoint_journal_compat.py

      - name: Format
        run: cargo fmt --all

      - name: Build framework
        run: cargo build -p kanari-framework-builder

      - name: Check object stack
        run: |
          cargo check \
            -p kanari-types \
            -p kanari-move-runtime-v1 \
            -p kanari-core \
            -p kanari-rpc-api \
            -p kanari-rpc-client \
            -p kanari-rpc-server \
            -p kanari-node \
            -p kanari

      - name: Test object stack
        run: |
          cargo test -p kanari-types --lib object
          cargo test -p kanari-move-runtime-v1 --lib state_object -- --nocapture
          cargo test -p kanari-core --lib object_ -- --nocapture

      - name: Commit validated object journal
        run: |
          git config user.name 'kanari-object-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No object journal changes required'
            exit 0
          fi
          git commit -m 'refactor: finalize object transactions atomically [object-journal-v2]'
          git push origin HEAD:object-centric
