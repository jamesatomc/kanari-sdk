name: Apply Engine Hardening

on:
  push:
    branches:
      - security/hardening-p0-remediation-20260623

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/hardening-p0-remediation-20260623
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply exact source transformations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/kanari-core/src/engine.rs')
          source = path.read_text()

          replacements = [
              (
                  '''        self.execute_tx_waves_parallel_inner(
              transactions,
              state_arc,
              timestamp,
              persist_objects,
              false,
              true,
          )''',
                  '''        self.execute_tx_waves_parallel_inner(
              transactions,
              state_arc,
              timestamp,
              persist_objects,
              true,
              true,
          )''',
                  'deterministic execution mode',
              ),
              (
                  '''                    KanariAddress::parse_to_account_address(sender)?,
                      None,
                      timestamp,''',
                  '''                    KanariAddress::parse_to_account_address(sender)?,
                      Some((tx.gas_limit(), tx.gas_price())),
                      timestamp,''',
                  'publish gas budget',
              ),
              (
                  '''                    Some(sender_addr),
                      None,
                      timestamp,''',
                  '''                    Some(sender_addr),
                      Some((tx.gas_limit(), tx.gas_price())),
                      timestamp,''',
                  'entry-function gas budget',
              ),
          ]

          for old, new, label in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one source match, found {count}')
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY
      - name: Validate patch shape
        shell: bash
        run: |
          git diff --check
          git diff -- crates/kanari-core/src/engine.rs
          grep -Fq 'Some((tx.gas_limit(), tx.gas_price()))' crates/kanari-core/src/engine.rs
      - name: Compile affected crates
        run: cargo check -p kanari-core -p kanari-move-runtime-v1 --all-targets
      - name: Test affected crates
        run: |
          cargo test -p kanari-core --lib
          cargo test -p kanari-move-runtime-v1 --lib
      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/kanari-core/src/engine.rs
          git commit -m 'security(core): bind Move gas and serialize deterministic execution'
          git push origin HEAD:security/hardening-p0-remediation-20260623
