name: Remediation CI

on:
  push:
    branches:
      - remediation/all-20260620
      - security/hardening-p0-remediation-20260623
  pull_request:
    branches:
      - kanari-sdk
      - remediation/all-20260620

permissions:
  contents: read

concurrency:
  group: remediation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MOVE_STDLIB_PATH: ${{ github.workspace }}/crates/kanari-frameworks/packages/move-stdlib/build/MoveStdlib/bytecode_modules
      KANARI_FRAMEWORK_PATH: ${{ github.workspace }}/crates/kanari-frameworks/packages/kanari-system/build/KanariSystem/bytecode_modules
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check patch whitespace
        run: git diff --check
      - name: Build Move framework bytecode
        run: |
          cargo run -p kanari -- move build --package-path crates/kanari-frameworks/packages/move-stdlib
          cargo run -p kanari -- move build --package-path crates/kanari-frameworks/packages/kanari-system
          test -d "$MOVE_STDLIB_PATH"
          test -d "$KANARI_FRAMEWORK_PATH"
      - name: Compile affected crates
        run: >-
          cargo check
          -p kanari-auth
          -p kanari-node
          -p kanari-core
          -p kanari-rpc-server
          -p kanari-move-runtime-v1
          --all-targets
      - name: Test auth
        run: cargo test -p kanari-auth --lib
      - name: Test node
        run: cargo test -p kanari-node
      - name: Test RPC
        run: cargo test -p kanari-rpc-server --lib
      - name: Test core
        run: cargo test -p kanari-core --lib
      - name: Test Move runtime
        run: cargo test -p kanari-move-runtime-v1 --lib

  engine-hardening-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MOVE_STDLIB_PATH: ${{ github.workspace }}/crates/kanari-frameworks/packages/move-stdlib/build/MoveStdlib/bytecode_modules
      KANARI_FRAMEWORK_PATH: ${{ github.workspace }}/crates/kanari-frameworks/packages/kanari-system/build/KanariSystem/bytecode_modules
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Apply exact gas and scheduler hardening candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/kanari-core/src/engine.rs')
          source = path.read_text()
          replacements = [
              (
                  "            persist_objects,\n            false,\n            true,\n        )",
                  "            persist_objects,\n            true,\n            true,\n        )",
                  'deterministic execution mode',
              ),
              (
                  "                    KanariAddress::parse_to_account_address(sender)?,\n                    None,\n                    timestamp,",
                  "                    KanariAddress::parse_to_account_address(sender)?,\n                    Some((tx.gas_limit(), tx.gas_price())),\n                    timestamp,",
                  'publish gas budget',
              ),
              (
                  "                    Some(sender_addr),\n                    None,\n                    timestamp,",
                  "                    Some(sender_addr),\n                    Some((tx.gas_limit(), tx.gas_price())),\n                    timestamp,",
                  'entry-function gas budget',
              ),
          ]

          for old, new, label in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one source match, found {count}')
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY
      - name: Validate candidate diff
        shell: bash
        run: |
          git diff --check
          test "$(grep -Fc 'Some((tx.gas_limit(), tx.gas_price()))' crates/kanari-core/src/engine.rs)" -eq 2
          git diff -- crates/kanari-core/src/engine.rs
      - name: Build Move framework bytecode
        run: |
          cargo run -p kanari -- move build --package-path crates/kanari-frameworks/packages/move-stdlib
          cargo run -p kanari -- move build --package-path crates/kanari-frameworks/packages/kanari-system
          test -d "$MOVE_STDLIB_PATH"
          test -d "$KANARI_FRAMEWORK_PATH"
      - name: Compile candidate
        run: cargo check -p kanari-core -p kanari-move-runtime-v1 --all-targets
      - name: Test candidate and capture logs
        id: candidate-tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p validated/logs
          cargo test -p kanari-core --lib 2>&1 | tee validated/logs/kanari-core-tests.log
          core_status=${PIPESTATUS[0]}
          echo "$core_status" > validated/logs/kanari-core-tests.status
          cargo test -p kanari-move-runtime-v1 --lib 2>&1 | tee validated/logs/move-runtime-tests.log
          runtime_status=${PIPESTATUS[0]}
          echo "$runtime_status" > validated/logs/move-runtime-tests.status
          exit 0
      - name: Stage candidate
        if: always()
        run: |
          mkdir -p validated/crates/kanari-core/src
          cp crates/kanari-core/src/engine.rs validated/crates/kanari-core/src/engine.rs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-hardening-diagnostics
          path: validated
          retention-days: 1
      - name: Enforce candidate test result
        if: always()
        shell: bash
        run: |
          test "$(cat validated/logs/kanari-core-tests.status)" -eq 0
          test "$(cat validated/logs/move-runtime-tests.status)" -eq 0

  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reject unpinned Git dependencies
        shell: bash
        run: |
          if grep -RIn --include='Cargo.toml' -E 'git[[:space:]]*=[[:space:]]*"[^"]+"' . \
            | grep -vE '(rev|tag)[[:space:]]*='; then
            echo 'Git dependencies must be pinned by rev or tag.' >&2
            exit 1
          fi

  production-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify production safety gates
        shell: bash
        run: |
          grep -q 'E_MUTABLE_OBJECT_BORROW_DISABLED' crates/kanari-frameworks/packages/kanari-system/sources/object.move
          grep -q 'Move view execution is temporarily disabled' crates/kanari-core/src/engine/queries.rs
          grep -q 'default_value = "127.0.0.1"' crates/kanari-node/src/main.rs
          grep -q 'MAX_DECOMPRESSED_P2P_PAYLOAD' crates/kanari-node/src/p2p.rs
          ! grep -RIn --include='*.rs' 'consensus_private_key_hex' crates/kanari-node
