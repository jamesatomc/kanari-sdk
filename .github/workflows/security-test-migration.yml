name: Security test migration

on:
  pull_request:
    branches:
      - fix-gas
    paths:
      - scripts/migrate_security_tests.py
      - .github/workflows/security-test-migration.yml

permissions:
  contents: write

jobs:
  migrate-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Migrate legacy security tests
        run: |
          python3 scripts/migrate_security_tests.py
          cargo fmt --all
          git diff --check
      - name: Run core tests
        run: cargo test -p kanari-core --lib
      - name: Commit migrated tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/kanari-core/tests/unit/engine_tests.rs
          git commit -m "test(security): align engine tests with canonical protocol"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
