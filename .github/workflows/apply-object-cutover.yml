name: Apply Object Cutover

on:
  pull_request:
    branches:
      - kanari-sdk

permissions:
  contents: write

concurrency:
  group: apply-object-cutover
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: object-centric
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Apply cutover
        run: python .github/scripts/apply_object_cutover.py

      - name: Format
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all 2>&1 | tee object-cutover.log

      - name: Check protocol crates
        shell: bash
        run: |
          set -o pipefail
          cargo check -p kanari-types -p kanari-move-runtime-v1 -p kanari-core -p kanari-rpc-server 2>&1 | tee -a object-cutover.log

      - name: Test object protocol
        shell: bash
        run: |
          set -o pipefail
          cargo test -p kanari-types --lib object 2>&1 | tee -a object-cutover.log
          cargo test -p kanari-move-runtime-v1 --lib state_object -- --nocapture 2>&1 | tee -a object-cutover.log
          cargo test -p kanari-core --lib object_ -- --nocapture 2>&1 | tee -a object-cutover.log

      - name: Upload cutover log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-cutover-log
          path: object-cutover.log
          retention-days: 1

      - name: Commit validated cutover
        run: |
          if git diff --quiet; then
            echo 'No cutover changes required'
            exit 0
          fi
          git config user.name 'kanari-object-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: apply object-only runtime cutover [object-cutover]'
          git push origin HEAD:object-centric
