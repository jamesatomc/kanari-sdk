name: Apply Object Cutover

on:
  push:
    branches:
      - object-centric
  pull_request:
    branches:
      - kanari-sdk

permissions:
  contents: write

concurrency:
  group: apply-object-cutover
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: object-centric
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Apply cutover
        run: |
          python .github/scripts/apply_object_cutover.py
          python .github/scripts/apply_object_transfer_cli.py
          python .github/scripts/apply_shared_pay_gas.py
          python .github/scripts/apply_shared_pay_gas_tests.py
          python .github/scripts/apply_object_operational_visibility.py

      - name: Format
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all 2>&1 | tee object-cutover.log

      - name: Build framework bytecode
        shell: bash
        run: |
          set -o pipefail
          cargo build -p kanari-framework-builder 2>&1 | tee -a object-cutover.log

      - name: Check object protocol, RPC, node, and CLI
        shell: bash
        run: |
          set -o pipefail
          cargo check \
            -p kanari-types \
            -p kanari-move-runtime-v1 \
            -p kanari-core \
            -p kanari-rpc-api \
            -p kanari-rpc-client \
            -p kanari-rpc-server \
            -p kanari-node \
            -p kanari \
            2>&1 | tee -a object-cutover.log

      - name: Test object protocol
        shell: bash
        run: |
          set -o pipefail
          cargo test -p kanari-types --lib object 2>&1 | tee -a object-cutover.log
          cargo test -p kanari-move-runtime-v1 --lib state_object -- --nocapture 2>&1 | tee -a object-cutover.log
          cargo test -p kanari-core --lib object_ -- --nocapture 2>&1 | tee -a object-cutover.log
          cargo test -p kanari-rpc-client --lib 2>&1 | tee -a object-cutover.log

      - name: Upload cutover log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-cutover-log
          path: object-cutover.log
          retention-days: 1

      - name: Commit validated cutover
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if git diff --quiet; then
            echo 'No cutover changes required'
            exit 0
          fi
          git config user.name 'kanari-object-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: expose object pending locks and cancellation [object-cutover]'
          git push origin HEAD:object-centric
