name: Object Runtime Reference Debug

on:
  push:
    branches:
      - object-centric
  pull_request:
    branches:
      - kanari-sdk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: object-centric-runtime-debug
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  runtime-object-reference-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run object reference tests
        shell: bash
        run: |
          set -o pipefail
          cargo test -p kanari-move-runtime-v1 --lib object_ref -- --nocapture 2>&1 | tee object-ref-test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-ref-test-log
          path: object-ref-test.log
          if-no-files-found: error
