name: Trusted Apply Actual Gas Fix

on:
  pull_request:
    branches:
      - fix-gas
    paths:
      - scripts/apply_actual_gas_cost_fix.py
      - scripts/fix_genesis_persistence_results.py
      - .github/workflows/apply-actual-gas-cost-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'audit/fix-critical-high'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: audit/fix-critical-high
          fetch-depth: 0

      - name: Apply actual gas-cost patch
        id: actual_patch
        continue-on-error: true
        run: python3 scripts/apply_actual_gas_cost_fix.py > actual-gas-patch.log 2>&1

      - name: Upload actual gas patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-gas-patch-diagnostics
          path: actual-gas-patch.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop after actual gas patch failure
        if: steps.actual_patch.outcome == 'failure'
        run: |
          cat actual-gas-patch.log
          exit 1

      - name: Propagate genesis persistence errors
        run: python3 scripts/fix_genesis_persistence_results.py

      - name: Format sources
        run: cargo fmt --all

      - name: Validate patch shape
        run: git diff --check

      - name: Commit source changes and remove staging files
        run: |
          git config user.name "kanari-security-bot"
          git config user.email "security-bot@users.noreply.github.com"
          git rm scripts/apply_actual_gas_cost_fix.py
          git rm scripts/fix_genesis_persistence_results.py
          git rm .github/workflows/apply-actual-gas-cost-fix.yml
          git add crates/kanari-core move-execution/v1/kanari-move-runtime-v1
          git commit -m "fix(gas): charge actual VM and storage cost"
          git push origin HEAD:audit/fix-critical-high
