name: Trusted Apply Medium Security Fixes

on:
  pull_request:
    branches:
      - fix-gas
    paths:
      - scripts/install_argon2_source.py
      - scripts/apply_node_identity.py
      - scripts/trigger_medium_security.txt

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'audit/fix-critical-high'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: audit/fix-critical-high
          fetch-depth: 0

      - name: Apply Medium remediations
        run: |
          python3 scripts/install_argon2_source.py
          python3 scripts/apply_node_identity.py
          cargo fmt --all
          git diff --check

      - name: Verify gas protocol schedule
        run: |
          set -o pipefail
          cargo check -p kanari-types --all-targets 2>&1 | tee -a medium-security.log
          cargo test -p kanari-types --lib 2>&1 | tee -a medium-security.log
          cargo clippy -p kanari-types --all-targets -- -D warnings 2>&1 | tee -a medium-security.log

      - name: Verify Argon2id migration
        run: |
          set -o pipefail
          cargo check -p kanari-auth --all-targets 2>&1 | tee -a medium-security.log
          cargo test -p kanari-auth --lib 2>&1 | tee -a medium-security.log
          cargo clippy -p kanari-auth --all-targets -- -D warnings 2>&1 | tee -a medium-security.log

      - name: Verify persistent P2P identity
        run: |
          set -o pipefail
          cargo check -p kanari-node --all-targets 2>&1 | tee -a medium-security.log
          cargo test -p kanari-node --lib 2>&1 | tee -a medium-security.log
          cargo clippy -p kanari-node --all-targets -- -D warnings 2>&1 | tee -a medium-security.log

      - name: Verify core with canonical gas rules
        run: |
          set -o pipefail
          cargo check -p kanari-core --all-targets 2>&1 | tee -a medium-security.log

      - name: Upload Medium verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: medium-security-diagnostics
          path: medium-security.log
          if-no-files-found: error
          retention-days: 3

      - name: Commit verified source changes
        run: |
          git config user.name "kanari-security-bot"
          git config user.email "security-bot@users.noreply.github.com"
          git add crates/kanari-auth/src/private_key_crypto.rs
          git add crates/kanari-node/src/app.rs crates/kanari-node/Cargo.toml
          git commit -m "fix(security): close Medium gas, KDF, and P2P identity findings"
          git push origin HEAD:audit/fix-critical-high
