name: Trusted Apply Gas Compile Fix

on:
  pull_request:
    branches:
      - fix-gas
    paths:
      - scripts/fix_actual_gas_compile.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'audit/fix-critical-high'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: audit/fix-critical-high
          fetch-depth: 0

      - name: Apply compile fix
        run: |
          python3 scripts/fix_actual_gas_compile.py
          cargo fmt --all
          git diff --check

      - name: Commit compile fix
        run: |
          git config user.name "kanari-security-bot"
          git config user.email "security-bot@users.noreply.github.com"
          git add crates/kanari-core/src/engine.rs
          git commit -m "fix(gas): use scoped gas cost variables"
          git push origin HEAD:audit/fix-critical-high
