name: Trusted Apply Actual Gas Fix

on:
  pull_request:
    branches:
      - fix-gas
    paths:
      - scripts/apply_actual_gas_cost_fix.py
      - scripts/fix_genesis_persistence_results.py
      - .github/workflows/apply-actual-gas-cost-fix.yml

permissions:
  contents: read

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'audit/fix-critical-high'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: audit/fix-critical-high
          fetch-depth: 0

      - name: Normalize duplicate runtime replacement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_actual_gas_cost_fix.py")
          text = path.read_text()
          old = '''fn = replace_once(
              fn,
              \'''                    Ok(move_cs) => changeset.merge(move_cs),\''',
              \'''                    Ok(move_cs) => {
                                  runtime_completed = true;
                                  changeset.merge(move_cs);
                              },\''',
              "track publish runtime completion",
          )'''
          new = '''fn = fn.replace(
              \'''                    Ok(move_cs) => changeset.merge(move_cs),\''',
              \'''                    Ok(move_cs) => {
                                  runtime_completed = true;
                                  changeset.merge(move_cs);
                              },\''',
              1,
          )'''
          if text.count(old) != 1:
              raise RuntimeError(f"expected one publish replacement block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply actual gas-cost patch
        run: python3 scripts/apply_actual_gas_cost_fix.py

      - name: Propagate genesis persistence errors
        run: python3 scripts/fix_genesis_persistence_results.py

      - name: Format sources
        run: cargo fmt --all

      - name: Validate patch shape
        run: git diff --check

      - name: Stage patched source artifact
        run: |
          mkdir -p patched-source
          while IFS= read -r file; do
            mkdir -p "patched-source/$(dirname "$file")"
            cp "$file" "patched-source/$file"
          done <<'FILES'
          crates/kanari-core/src/engine.rs
          crates/kanari-core/tests/unit/engine_tests.rs
          move-execution/v1/kanari-move-runtime-v1/src/changeset.rs
          move-execution/v1/kanari-move-runtime-v1/src/genesis.rs
          move-execution/v1/kanari-move-runtime-v1/src/move_runtime/gas_ops.rs
          move-execution/v1/kanari-move-runtime-v1/tests/unit/changeset_tests.rs
          FILES

      - name: Upload patched sources
        uses: actions/upload-artifact@v4
        with:
          name: patched-actual-gas-sources
          path: patched-source
          if-no-files-found: error
          retention-days: 3
