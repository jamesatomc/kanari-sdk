name: Trusted Apply Critical High Followup

on:
  pull_request:
    branches:
      - fix-gas
    paths:
      - scripts/fix_clippy_and_cleanup.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'audit/fix-critical-high'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: audit/fix-critical-high
          fetch-depth: 0

      - name: Apply follow-up patch
        run: |
          python3 scripts/fix_clippy_and_cleanup.py
          cargo fmt --all
          git diff --check

      - name: Commit follow-up patch
        run: |
          git config user.name "kanari-security-bot"
          git config user.email "security-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(ci): resolve clippy blockers"
          git push origin HEAD:audit/fix-critical-high
