name: Rust CI and Security Audit

on:
  pull_request:
    branches:
      - kanari-sdk
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain.toml"
      - "audit.toml"
      - ".github/workflows/rust-ci.yml"
  push:
    branches:
      - kanari-sdk
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain.toml"
      - "audit.toml"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  format:
    name: Rustfmt (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-clippy-
            ${{ runner.os }}-cargo-

      - name: Run Clippy autofix pass
        run: |
          set +e
          cargo clippy --fix --quiet -p kanari-system-natives --all-targets --allow-dirty --allow-staged --message-format short -- -D warnings > clippy.log 2>&1
          status=$?
          git diff > clippy-fix.patch
          mapfile -d '' changed_files < <(git diff --name-only -z)
          if (( ${#changed_files[@]} > 0 )); then
            tar -czf clippy-fixed-files.tar.gz "${changed_files[@]}"
          else
            tar -czf clippy-fixed-files.tar.gz --files-from /dev/null
          fi
          cat clippy.log
          exit $status

      - name: Upload Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-diagnostics
          path: |
            clippy.log
            clippy-fix.patch
            clippy-fixed-files.tar.gz
          if-no-files-found: error
          retention-days: 3

  test:
    name: Workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-
            ${{ runner.os }}-cargo-

      - name: Run workspace tests
        run: cargo test --workspace --lib --bins

  audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo tools and registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-v1-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-v1-

      - name: Generate workspace lockfile
        run: cargo generate-lockfile

      - name: Capture audited dependency trees
        run: |
          {
            for crate in hickory-proto rsa bincode difference paste pqcrypto-dilithium pqcrypto-internals pqcrypto-sphincsplus pqcrypto-traits; do
              echo "===== cargo tree -i ${crate} ====="
              cargo tree -i "${crate}" || true
              echo
            done
          } > audit-dependency-tree.txt

      - name: Upload audit dependency tree
        uses: actions/upload-artifact@v4
        with:
          name: audit-diagnostics
          path: |
            Cargo.lock
            audit-dependency-tree.txt
          if-no-files-found: error
          retention-days: 3

      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi

      - name: Audit dependencies
        run: cargo audit --deny warnings
