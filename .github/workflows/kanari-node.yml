name: Build Kanari Node

on:
  push:
    branches: [ main, kanari-sdk ]
    paths:
      - 'crates/kanari-node/**'
      - 'crates/kanari-core/**'
      - 'crates/kanari-common/**'
      - 'crates/kanari-types/**'
      - 'crates/kanari-db-common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/kanari-node.yml'
  pull_request:
    branches: [ main, kanari-sdk ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-node:
    name: Build Kanari Node - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: Linux x64
            binary: kanari-node
            
          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: Linux ARM64
            binary: kanari-node
            use_cross: true
            
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: Windows x64
            binary: kanari-node.exe
            
          # macOS x64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macOS x64
            binary: kanari-node
            
          # macOS ARM64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macOS ARM64
            binary: kanari-node

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross for cross-compilation
      if: matrix.use_cross == true
      run: |
        cargo install cross --git https://github.com/cross-rs/cross

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-node-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.target }}-cargo-node-
          ${{ runner.os }}-${{ matrix.target }}-cargo-

    - name: Build Move frameworks
      run: cargo build --package kanari-framework-builder --release

    - name: Verify Move frameworks
      run: |
        ls -la crates/kanari-frameworks/packages/move-stdlib/build/MoveStdlib/bytecode_modules/ || echo "Move stdlib not found"
        ls -la crates/kanari-frameworks/packages/kanari-system/build/KanariSystem/bytecode_modules/ || echo "Kanari system not found"
      shell: bash

    - name: Build kanari-node (native)
      if: matrix.use_cross != true
      run: cargo build --release --package kanari-node --target ${{ matrix.target }}

    - name: Build kanari-node (cross)
      if: matrix.use_cross == true
      run: cross build --release --package kanari-node --target ${{ matrix.target }}

    - name: Test kanari-node (native only)
      if: matrix.use_cross != true
      run: cargo test --package kanari-node --target ${{ matrix.target }}
      continue-on-error: true

    - name: Get binary info (Unix)
      if: runner.os != 'Windows'
      run: |
        ls -lh target/${{ matrix.target }}/release/${{ matrix.binary }}
        file target/${{ matrix.target }}/release/${{ matrix.binary }}

    - name: Get binary info (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Get-Item target/${{ matrix.target }}/release/${{ matrix.binary }} | Select-Object Name, Length, LastWriteTime

    - name: Prepare package directory
      shell: bash
      run: |
        mkdir -p package/kanari-node
        cp target/${{ matrix.target }}/release/${{ matrix.binary }} package/kanari-node/
        cp -r crates/kanari-frameworks/packages package/kanari-node/crates/kanari-frameworks/ || echo "Move packages not found"

    - name: Create tarball (Unix)
      if: runner.os != 'Windows'
      run: |
        cd package
        tar czf ../kanari-node-${{ matrix.target }}.tar.gz kanari-node/

    - name: Create zip (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Compress-Archive -Path package/kanari-node -DestinationPath kanari-node-${{ matrix.target }}.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kanari-node-${{ matrix.target }}
        path: |
          kanari-node-${{ matrix.target }}.tar.gz
          kanari-node-${{ matrix.target }}.zip
        if-no-files-found: ignore

    - name: Upload binary directly
      uses: actions/upload-artifact@v4
      with:
        name: kanari-node-${{ matrix.target }}-binary
        path: target/${{ matrix.target }}/release/${{ matrix.binary }}

  test-node:
    name: Test Kanari Node - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

    - name: Run all kanari-node tests
      run: cargo test --package kanari-node --verbose

    - name: Run integration tests
      run: cargo test --package kanari-node --test '*' --verbose
      continue-on-error: true
