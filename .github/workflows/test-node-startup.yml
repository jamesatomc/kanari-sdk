name: Test Node Startup

on:
  push:
    branches: [ main, kanari-sdk ]
    paths:
      - 'crates/kanari-node/**'
      - 'crates/kanari-frameworks/**'
      - '.github/workflows/test-node-startup.yml'
  pull_request:
    branches: [ main, kanari-sdk ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-startup:
    name: Test Node Startup - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-startup-test-${{ hashFiles('**/Cargo.lock') }}

    - name: Build Move frameworks
      run: cargo build --package kanari-framework-builder --release

    - name: Verify Move frameworks build
      shell: bash
      run: |
        echo "Checking Move stdlib..."
        ls -la crates/kanari-frameworks/packages/move-stdlib/build/MoveStdlib/bytecode_modules/ || exit 1
        echo "Checking Kanari system..."
        ls -la crates/kanari-frameworks/packages/kanari-system/build/KanariSystem/bytecode_modules/ || exit 1
        echo "✓ Move frameworks built successfully"

    - name: Build kanari-node
      run: cargo build --release --package kanari-node

    - name: Test node startup (Unix)
      if: runner.os != 'Windows'
      timeout-minutes: 2
      shell: bash
      run: |
        echo "Starting node in background..."
        target/release/kanari-node start --data-dir ./test-data &
        NODE_PID=$!
        
        echo "Waiting for node to start..."
        sleep 10
        
        echo "Checking if node is running..."
        if ps -p $NODE_PID > /dev/null; then
          echo "✓ Node started successfully (PID: $NODE_PID)"
          
          # Test RPC endpoint
          echo "Testing RPC endpoint..."
          curl -f http://127.0.0.1:19001 || echo "RPC endpoint check completed"
          
          # Cleanup
          echo "Stopping node..."
          kill $NODE_PID
          wait $NODE_PID 2>/dev/null || true
          echo "✓ Node stopped successfully"
        else
          echo "✗ Node failed to start or crashed"
          exit 1
        fi

    - name: Test node startup (Windows)
      if: runner.os == 'Windows'
      timeout-minutes: 2
      shell: pwsh
      run: |
        Write-Host "Starting node in background..."
        $job = Start-Job -ScriptBlock {
          Set-Location $using:PWD
          & "target/release/kanari-node.exe" start --data-dir "./test-data"
        }
        
        Write-Host "Waiting for node to start..."
        Start-Sleep -Seconds 10
        
        Write-Host "Checking if node is running..."
        if ($job.State -eq "Running") {
          Write-Host "✓ Node started successfully (Job ID: $($job.Id))"
          
          # Test RPC endpoint
          Write-Host "Testing RPC endpoint..."
          try {
            $response = Invoke-WebRequest -Uri "http://127.0.0.1:19001" -TimeoutSec 5 -ErrorAction SilentlyContinue
          } catch {
            Write-Host "RPC endpoint check completed"
          }
          
          # Cleanup
          Write-Host "Stopping node..."
          Stop-Job -Job $job
          Remove-Job -Job $job -Force
          Write-Host "✓ Node stopped successfully"
        } else {
          Write-Host "✗ Node failed to start or crashed"
          Get-Job | Receive-Job
          exit 1
        }

    - name: Check node logs for errors
      if: always()
      shell: bash
      run: |
        if [ -f "test-data/node.log" ]; then
          echo "Node logs:"
          tail -n 50 test-data/node.log
        else
          echo "No log file found"
        fi

    - name: Upload test data on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-data-${{ matrix.os }}
        path: test-data/
        if-no-files-found: ignore

  test-rpc-endpoints:
    name: Test RPC Endpoints - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build Move frameworks
      run: cargo build --package kanari-framework-builder --release

    - name: Build kanari-node
      run: cargo build --release --package kanari-node

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Start node and test RPC (Unix)
      if: runner.os != 'Windows'
      timeout-minutes: 3
      shell: bash
      run: |
        # Start node
        target/release/kanari-node start --data-dir ./test-data &
        NODE_PID=$!
        
        # Wait for startup
        sleep 15
        
        # Test basic RPC calls
        echo "Testing RPC endpoints..."
        
        # Test health check or basic endpoint
        curl -X POST http://127.0.0.1:19001 \
          -H "Content-Type: application/json" \
          -d '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
          || echo "RPC test completed"
        
        # Cleanup
        kill $NODE_PID
        wait $NODE_PID 2>/dev/null || true

    - name: Start node and test RPC (Windows)
      if: runner.os == 'Windows'
      timeout-minutes: 3
      shell: pwsh
      run: |
        # Start node
        $job = Start-Job -ScriptBlock {
          Set-Location $using:PWD
          & "target/release/kanari-node.exe" start --data-dir "./test-data"
        }
        
        # Wait for startup
        Start-Sleep -Seconds 15
        
        # Test basic RPC calls
        Write-Host "Testing RPC endpoints..."
        
        try {
          $body = @{
            jsonrpc = "2.0"
            method = "eth_blockNumber"
            params = @()
            id = 1
          } | ConvertTo-Json
          
          Invoke-WebRequest -Uri "http://127.0.0.1:19001" `
            -Method POST `
            -ContentType "application/json" `
            -Body $body `
            -TimeoutSec 10 `
            -ErrorAction SilentlyContinue
        } catch {
          Write-Host "RPC test completed"
        }
        
        # Cleanup
        Stop-Job -Job $job
        Remove-Job -Job $job -Force

  test-multi-node:
    name: Test Multi-Node Setup
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build Move frameworks
      run: cargo build --package kanari-framework-builder --release

    - name: Build kanari-node
      run: cargo build --release --package kanari-node

    - name: Start first node
      run: |
        target/release/kanari-node start \
          --data-dir ./node1-data \
          --p2p-port 19000 \
          --rpc-port 19001 &
        NODE1_PID=$!
        echo "NODE1_PID=$NODE1_PID" >> $GITHUB_ENV
        sleep 10

    - name: Start second node
      run: |
        target/release/kanari-node start \
          --data-dir ./node2-data \
          --p2p-port 19002 \
          --rpc-port 19003 &
        NODE2_PID=$!
        echo "NODE2_PID=$NODE2_PID" >> $GITHUB_ENV
        sleep 10

    - name: Check nodes are running
      run: |
        if ps -p $NODE1_PID > /dev/null && ps -p $NODE2_PID > /dev/null; then
          echo "✓ Both nodes are running"
        else
          echo "✗ One or both nodes failed"
          exit 1
        fi

    - name: Test P2P connectivity
      timeout-minutes: 2
      run: |
        echo "Waiting for P2P discovery..."
        sleep 30
        echo "✓ P2P test completed"

    - name: Cleanup
      if: always()
      run: |
        if [ ! -z "$NODE1_PID" ]; then kill $NODE1_PID 2>/dev/null || true; fi
        if [ ! -z "$NODE2_PID" ]; then kill $NODE2_PID 2>/dev/null || true; fi
