name: Export Object Source

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git rev-parse HEAD > object-source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: object-source-metadata
          path: object-source-commit.txt
