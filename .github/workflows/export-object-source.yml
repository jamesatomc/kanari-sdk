name: Export Object Source

on:
  push:
    branches:
      - object-centric
  pull_request:
    branches:
      - kanari-sdk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-object-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record metadata
        run: |
          git rev-parse HEAD > object-source-commit.txt
          git rev-parse 'HEAD^{tree}' > object-source-tree.txt
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: kanari-object-source
          retention-days: 1
          path: |
            Cargo.toml
            Cargo.lock
            crates
            move-execution
            third_party/move
            object-source-commit.txt
            object-source-tree.txt
