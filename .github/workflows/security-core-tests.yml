name: Security core tests

on:
  pull_request:
    branches:
      - fix-gas
    paths:
      - .github/workflows/security-core-tests.yml
      - crates/kanari-core/**
      - crates/kanari-types/**
      - move-execution/v1/kanari-move-runtime-v1/**

permissions:
  contents: read

jobs:
  core-tests:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Core tests
        env:
          RUST_BACKTRACE: '1'
        run: cargo test -p kanari-core --lib
