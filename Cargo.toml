[workspace]
# Workspace configuration for the "kanari-sdk" project.
# Defines the overall structure and settings for the workspace.
# name = "kanari-sdk"
resolver = "2"                   # Use the version 2 feature resolver for more consistent feature resolution.


# Exclude List: Directories to be excluded from the workspace build.
# This can be useful for excluding third-party code or components 
# that are not directly part of the workspace's build process.
exclude = [
    "third_party/move",           # Exclude the 'third_party/move' directory from workspace builds.
    "crates/kanari-crypto/fuzz",  # Exclude fuzz targets from workspace builds (fuzzing uses separate Cargo.toml)
    "crates/mysticeti",           # Nested Mysticeti workspace used through explicit path dependencies.
]


# Members List: Crates that are part of this workspace.
# These are the core components of the "kanari-" project.
members = [
      "crates/kanari",
      "crates/kanari-common",
      "crates/kanari-crypto", 
      "crates/kanari-auth",
      "crates/kanari-framework-builder",
      "crates/kanari-frameworks", 
      "crates/kanari-types",
      "crates/kanari-node",
      "crates/kanari-rpc-api", 
      "crates/kanari-rpc-client", 
      "crates/kanari-rpc-server",
      "crates/kanari-rpc-loadgen",
      "crates/kanari-faucet",
      "packages/kanari_flutter/rust",
      "crates/kanari-core",
      "crates/smt",
      "crates/kanari-benchmarks", 
      "crates/kanari-system-natives",
      "crates/kanari-db-common", 
      "sdk/wallet", 
      "crates/kanari-indexer", 
      "crates/run-auth",
      "crates/kanari-open-rpc",
      "crates/kanari-open-rpc-macros",
      "crates/kanari-open-rpc-spec",
      "crates/kanari-open-rpc-spec-builder",

      # move-execution
      "move-execution/v1/kanari-move-runtime-v1",
]


# Workspace Package Configuration: Metadata for the entire workspace as a package.
# This information is used when publishing the SDK as a crate.
[workspace.package]
edition = "2024"                                                                                                   # Use Rust 2024 edition.
categories = ["development-tools"]                                                                                 # Categorize as development tools on crates.io.
keywords = ["blockchain", "sdk", "move", "rust", "ifps", "storage", "wallet", "framework"]     # Keywords for crates.io search.
homepage = "https://kanarinetwork.site"                                                                                # Project homepage.
documentation = "https://docs.kanarinetwork.site"                                                                      # Link to project documentation.
version = "0.2.4"                                                                                                  # Current version of the SDK.
authors = ["Kanari Network"]                                                                                       # Authors of the SDK.
license = "Apache-2.0"                                                                                             # License information.
repository = "https://github.com/kanari-network/kanari-sdk"                                                        # Link to the code repository.
description = "Kanari Network SDK"                                                                                 # Short description of the SDK.


# Dependencies that should be kept in sync through the whole workspace
[workspace.dependencies]

# ============================================================================
# Core Runtime & Concurrency
# ============================================================================
tokio = { version = "1.53.1", features = ["full"] }
rayon = "1.12.0"
crossbeam-channel = "0.5.16"

# ============================================================================
# Networking & Communication
# ============================================================================
## P2P Networking
libp2p = { version = "0.56.0", features = ["tcp", "noise", "yamux", "gossipsub", "kad", "identify", "macros", "tokio", "relay", "dcutr", "ping"] }

## HTTP/Web APIs
reqwest = { version = "0.13.4", features = ["json"] }
axum = "0.8.9"
tower-http = { version = "0.7.0", features = ["cors", "limit", "timeout"] }
tower = { version = "0.5.3", features = ["limit", "util"] }
axum-client-ip = "1.3.1"                                                              # IP extraction for axum

# ============================================================================
# Serialization & Data Formats
# ============================================================================
serde = { version = "1.0.229", default-features = true, features = ["rc"] }
serde_json = { version = "1.0.151", default-features = true }
serde_yaml = { version = "0.9.34", default-features = true }
toml = { version = "1.1.4", default-features = true }

## Blockchain-specific serialization
bcs = { version = "0.2.1" }
bincode = { version = "2.0.1", features = ["serde", "alloc"] }

# ============================================================================
# Cryptography - Classical (ECC, Signatures, Hashing)
# ============================================================================
## Hash Functions
sha2 = "0.11.0"
sha3 = "0.11.0"
blake3 = { version = "1.8.5" }

## Elliptic Curve Cryptography (ECC)
k256 = { version = "0.14.0", features = ["ecdsa", "std", "sha2"] }                 # secp256k1 (Bitcoin/Ethereum)
p256 = { version = "0.14.0", features = ["ecdsa", "std", "sha2"] }                 # NIST P-256
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }                    # Ed25519 signatures
curve25519-dalek = { version = "5.0.0", features = ["rand_core"] }                 # X25519 key exchange
secp256k1 = { version = "0.31.1", features = ["recovery"] }                        # secp256k1 with recovery
rsa = { version = "0.9.10", default-features = false, features = ["std"] }         # RSA signature verification

## Symmetric Encryption & MAC
aes-gcm = "0.11.0"                                                                 # Authenticated encryption
hmac = { version = "0.13.0" }                                                      # HMAC for key derivation

## Key Derivation & Password Hashing
argon2 = { version = "0.5.3", default-features = true }                            # Password hashing
bip39 = { version = "2.2.2", features = ["rand"] }                                 # Mnemonic phrases
bip32 = "0.5.3"                                                                    # HD wallet derivation

## Encoding Utilities
hex = "0.4.3"
base64 = "0.23.0"
primitive-types = { version = "0.14.0", default-features = true }                  # U256, H160, etc.

# ============================================================================
# Cryptography - Post-Quantum (PQC)
# ============================================================================
pqcrypto-dilithium = "0.5.0"                                                       # Digital signatures (NIST finalist)
pqcrypto-kyber = "0.8.1"                                                           # Key encapsulation (NIST selected)
pqcrypto-sphincsplus = "0.7.2"                                                     # Stateless hash-based signatures
pqcrypto-traits = "0.3.5"                                                          # Common PQC traits

# ============================================================================
# Memory Security & Timing Attack Prevention
# ============================================================================
zeroize = { version = "1.9.0", features = ["derive"] }                              # Secure memory zeroing
subtle = "2.6.1"                                                                    # Constant-time operations
rpassword = "7.5.4"                                                                 # Secure password input
fs2 = "0.4.3"                                                                       # File locking for key files

# ============================================================================
# Database & Persistent Storage
# ============================================================================
rocksdb = "0.24.0"                                                                  # High-performance embedded DB
zstd = "0.13.3"                                                                     # Compression for storage/network

# ============================================================================
# Caching & Performance Optimization
# ============================================================================
moka = { version = "0.12.15", features = ["sync"] }                                 # Thread-safe caching
lru = "0.18.1"                                                                      # LRU cache
dashmap = "6.2.1"                                                                   # Concurrent HashMap
ahash = "0.8.12"                                                                    # Fast non-cryptographic hasher
siphasher = "1.0.3"                                                                 # SipHash implementation

# ============================================================================
# Error Handling & Result Types
# ============================================================================
anyhow = "1.0.104"
thiserror = { version = "2.0.19", default-features = true }
better_any = { version = "0.2.1", features = ["derive"] }

# ============================================================================
# Logging, Tracing & Observability
# ============================================================================
log = { version = "0.4.33", default-features = true }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
env_logger = "0.11.11"
dotenvy = "0.15.7"
prometheus = "0.14.0"

# ============================================================================
# CLI, Configuration & Utilities
# ============================================================================
clap = { version = "4.6.4", features = ["derive"] }                                 # CLI argument parsing
dirs = "6.0.0"                                                                      # Platform-specific directories
walkdir = "2.5.0"                                                                   # Directory traversal
num_cpus = "1.17.0"                                                                 # CPU core detection
regex = "1.13.1"                                                                    # Regular expressions for validation
smallvec = "1.15.2"                                                                 # Stack-allocated vectors
lazy_static = { version = "1.5.0", default-features = true }
once_cell = "1.21.4"

# ============================================================================
# Randomness & Testing
# ============================================================================
rand = "0.10.2"
rand_core = "0.10.1"
tempfile = "3.27.0"                                                                 # Temporary files for tests
proptest = "1.11.0"                                                                 # Property-based testing
arbitrary = { version = "1.4.2", features = ["derive"] }                            # Fuzzing support

# ============================================================================
# Authentication & 2FA
# ============================================================================
totp-rs = { version = "5.7.2", features = ["gen_secret", "otpauth"] }               # TOTP for 2FA
qrcode = "0.14.1"                                                                   # QR code generation
data-encoding = "2.11.0"                                                            # Data encoding utilities

# ============================================================================
# Time & Date Handling
# ============================================================================
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

# ============================================================================
# Mathematics & Numerics
# ============================================================================
num-integer = { version = "0.1.46" }

# ============================================================================
# Compression & Data Optimization
# ============================================================================
flate2 = "1.1.9"    # DEFLATE compression (gzip/zlib)

# ============================================================================
# Mobile & Cross-Platform Bridge
# ============================================================================
flutter_rust_bridge = "=2.12.0"  # Flutter ↔ Rust interop

# ============================================================================
# Memory Allocator (Performance Optimization)
# ============================================================================
tikv-jemallocator = { git = "https://github.com/jamesatomc/jemallocator.git", features = [
    "unprefixed_malloc_on_supported_platforms",
    "profiling",
] }

# ============================================================================
# Database
# ============================================================================
rusqlite = { version = "0.40.1", features = ["bundled", "chrono", "serde_json"] }

# ============================================================================
# Proc Macro Dependencies
# ============================================================================
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.3", features = ["full"] }

# ============================================================================

# ============================================================================
# Workspace Members (Internal Crates)
# ============================================================================
kanari-common = { path = "crates/kanari-common" }
kanari-crypto = { path = "crates/kanari-crypto" }
kanari-auth = { path = "crates/kanari-auth" }
kanari-types = { path = "crates/kanari-types" }
kanari-framework-builder = { path = "crates/kanari-framework-builder" }
kanari-frameworks = { path = "crates/kanari-frameworks" }
kanari-rpc-api = { path = "crates/kanari-rpc-api" }
kanari-rpc-client = { path = "crates/kanari-rpc-client" }
kanari-rpc-server = { path = "crates/kanari-rpc-server" }
kanari-faucet = { path = "crates/kanari-faucet" }
kanari-core = { path = "crates/kanari-core" }
kanari-system-natives = { path = "crates/kanari-system-natives" }
kanari-db-common = { path = "crates/kanari-db-common" }
kanari-open-rpc = { path = "crates/kanari-open-rpc" }
kanari-open-rpc-macros = { path = "crates/kanari-open-rpc-macros" }
kanari-open-rpc-spec = { path = "crates/kanari-open-rpc-spec" }

# SMT Support
smt = { path = "crates/smt" }

# Move Runtime
kanari-move-runtime-v1 = { path = "move-execution/v1/kanari-move-runtime-v1" }

# Move dependencies
move-binary-format = { path = "third_party/move/crates/move-binary-format" }
move-bytecode-utils = { path = "third_party/move/crates/move-bytecode-utils" }
move-bytecode-source-map = { path = "third_party/move/crates/move-bytecode-source-map" }
move-cli = { path = "third_party/move/crates/move-cli" }
move-compiler = { path = "third_party/move/crates/move-compiler" }
move-core-types = { path = "third_party/move/crates/move-core-types" }
move-disassembler = { path = "third_party/move/crates/move-disassembler" }
move-package = { path = "third_party/move/crates/move-package" }
move-unit-test = { path = "third_party/move/crates/move-unit-test" }
move-vm-config = { path = "third_party/move/crates/move-vm-config" }
move-vm-test-utils = { path = "third_party/move/crates/move-vm-test-utils/", features = [
  "tiered-gas",
] }
move-vm-types = { path = "third_party/move/crates/move-vm-types" }
move-vm-profiler = { path = "third_party/move/crates/move-vm-profiler" }
move-command-line-common = { path = "third_party/move/crates/move-command-line-common" }
move-transactional-test-runner = { path = "third_party/move/crates/move-transactional-test-runner" }
move-ir-types = { path = "third_party/move/crates/move-ir-types" }
move-prover = { path = "third_party/move/crates/move-prover" }
move-stackless-bytecode = { path = "third_party/move/crates/move-stackless-bytecode" }
move-symbol-pool = { path = "third_party/move/crates/move-symbol-pool" }
move-abstract-stack = { path = "third_party/move/crates/move-abstract-stack" }
move-docgen = { path = "third_party/move/crates/move-docgen" }
move-errmapgen = { path = "third_party/move/crates/move-errmapgen" }
move-stdlib = { path = "third_party/move/crates/move-stdlib" }
move-stdlib-natives = { path = "third_party/move/crates/move-stdlib-natives" }

move-vm-runtime = { path = "third_party/move/crates/move-vm-runtime" }
move-coverage = { path = "third_party/move/crates/move-coverage" }
move-bytecode-verifier = { path = "third_party/move/crates/move-bytecode-verifier" }

[patch.crates-io]
libp2p-kad = { path = "third_party/patches/libp2p-kad-0.48.0" }
proc-macro-error2 = { path = "third_party/patches/proc-macro-error2-2.0.1" }


# Profile Configurations: Define different build profiles for various scenarios.
[profile.bench]                  # Profile for benchmarking.
debug = true                     # Include debug information for profiling.
opt-level = 3                    # Maximum optimization level for performance.
lto = "thin"                     # Enable Link-Time Optimization (thin LTO for faster linking).
codegen-units = 1                # Reduce codegen units to improve LTO effectiveness (may increase compile time).

[profile.dev]                    # Profile for development builds.
debug = false                    # Disable debug information for easier debugging.
opt-level = 0                    # No optimization for faster compile times.
split-debuginfo = "unpacked"     # Configure debug info splitting for better debugger experience.
debug-assertions = true          # Enable debug assertions for development builds.
overflow-checks = true           # Enable overflow checks for development builds.
lto = false                      # Disable Link-Time Optimization for faster builds.
panic = 'unwind'                 # Enable unwinding for panic handling.
incremental = true               # Enable incremental compilation for faster builds.
codegen-units = 256              # Increase codegen units for faster parallel compilation.

[profile.ci]                     # Profile for Continuous Integration builds.
inherits = "test"                # Inherit settings from the 'test' profile (if defined, otherwise defaults).
debug = 0                        # Disable debug information for potentially faster and smaller builds.
incremental = false              # Disable incremental compilation for cleaner and more reliable CI builds.
codegen-units = 16               # Increase codegen units for potentially faster parallel compilation in CI.
opt-level = 1                    # Moderate optimization level for a balance of speed and performance.

[profile.release]                # Profile for release builds.
opt-level = 3                    # Optimize for speed.
debug = false                    # Disable debug information for release binaries.
debug-assertions = false         # Disable debug assertions for release builds.
overflow-checks = false          # Disable overflow checks for release builds.
lto = false                      # Disable LTO to avoid compiler crash/OOM.
panic = 'abort'                  # Remove unwinding code for panic handling.
codegen-units = 16               # Keep release builds stable/reproducible while retaining parallel codegen.
strip = true                     # Strip debug symbols from the final binary to reduce size.
